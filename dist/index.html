<!doctype html>
<html lang="vi">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#7160d9">
  <meta name="description" content="Không gian học TOEIC cá nhân: thư viện bài giảng từ Google Drive, lộ trình, ghi chú và tiến độ học tập.">
  <title>TOEIC Studio — Học theo nhịp của bạn</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./hierarchy.css">
  <link rel="stylesheet" href="./learning.css">

</head>
<body>
  <a class="skip" href="#main">Đến nội dung chính</a>
  <aside class="sidebar" id="sidebar">
    <a href="#home" class="brand" aria-label="TOEIC Studio · Tổng quan"><span class="brand-mark">t<span>✦</span></span><span>TOEIC<span class="brand-light">studio</span></span></a>
    <div class="workspace"><span class="workspace-avatar">S</span><div>Không gian của bạn<small>Học theo nhịp riêng</small></div><span class="tiny-star">✧</span></div>
    <div class="nav-label">GÓC HỌC TẬP</div>
    <nav aria-label="Điều hướng chính" id="nav"></nav>
    <div class="sidebar-bottom"><div class="encouragement"><span>✦</span><strong>Từng chút, mỗi ngày.</strong><p>Một bài học hôm nay là một bước tiến ngày mai.</p></div><button class="source-link" data-nav="source" aria-label="Nguồn Google Drive" title="Nguồn Google Drive"><span id="drive-icon"></span><span>Nguồn Google Drive<small>Danh mục đã nhập</small></span><span class="status-dot"></span></button></div>

  <div class="scrim" id="scrim"></div>
  <div class="page-shell">

    <main id="main" tabindex="-1"><div class="loading"><span class="spinner"></span>Đang mở thư viện của bạn…</div></main>
    <footer>TOEIC Studio <span>✦</span> Một không gian nhỏ, cho mục tiêu lớn.</footer>

  <dialog id="player" class="player-dialog" aria-labelledby="player-title"></dialog>
  <dialog id="settings" class="settings-dialog" aria-labelledby="settings-title"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
